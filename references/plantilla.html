<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
:root { color-scheme:light dark; --bg:#F7F7F5; --card:#FFFFFF; --tinta:#15181E; --texto:#333843; --suave:#565B66; --acento:#2F5FB8; --acento-texto:#2F5FB8; --sobre-acento:#FFFFFF; --boton-suave:#E6E9F0; --boton-suave-texto:#15181E; --linea:#DEDDD8; --caja:#A3A39D; --verde:#2B8A57; --rojo:#C8372D; --fondo-barra:#E6E5E0; --letra:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --letra-titulos:var(--letra); --mueve:1; }
@media (prefers-color-scheme: dark) { :root { --bg:#111318; --card:#181B22; --tinta:#F2F3F5; --texto:#D2D5DB; --suave:#A9AEB8; --acento-texto:#9DB8F0; --boton-suave:#252A35; --boton-suave-texto:#F2F3F5; --linea:#2C313C; --caja:#666C79; --verde:#4FB37C; --rojo:#F0837A; --fondo-barra:#252A35; } }
/* Con «reducir movimiento» se mueve menos, pero se mueve. */
@media (prefers-reduced-motion: reduce) { :root { --mueve:.35; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
/* Nada por debajo de 17 px: la base no baja de ahí y crece en pantalla grande. */
html { -webkit-text-size-adjust:100%; font-size:clamp(17px, calc(9px + .55vw), 20px); }
body { margin:0; background:var(--bg); color:var(--texto); font:400 1.0625rem/1.55 var(--letra); }
.hoja { width:min(1760px,100%); margin:0 auto; padding:28px clamp(16px,4vw,64px) 72px; }
h1,h2,h3 { font-family:var(--letra-titulos); color:var(--tinta); line-height:1.2; margin:0; }
h1 { font-size:clamp(2rem,3.2vw,3rem); font-weight:800; }
h2 { font-size:1.375rem; font-weight:800; margin:0 0 14px; }
h3 { font-size:1.125rem; font-weight:700; }
strong { color:var(--tinta); font-weight:700; }
code { font-size:.96em; }
a { color:var(--acento-texto); }

/* Cabecera: el nombre a la izquierda y, a la derecha, cuánto va hecho. Debajo, la barra de un solo color. */
.cab { display:flex; align-items:flex-end; justify-content:space-between; gap:16px 32px; flex-wrap:wrap; }
.cab-texto { min-width:0; flex:1 1 420px; }
.logo { display:block; height:48px; width:auto; max-width:100%; margin-bottom:12px; }
.sub { margin:8px 0 0; max-width:70ch; }
.sello { color:var(--suave); margin:6px 0 0; }
.sello.parada { color:var(--rojo); font-weight:600; }
.cab-lado { display:flex; align-items:flex-end; gap:20px; }
.cifra { font-family:var(--letra-titulos); font-weight:800; font-size:clamp(2.25rem,3vw,2.75rem); line-height:1; color:var(--tinta); text-align:right; }
.cifra-texto { color:var(--tinta); font-weight:600; margin:6px 0 0; text-align:right; white-space:nowrap; }
.mascota { display:block; width:88px; height:88px; object-fit:contain; flex:none; }
.mascota.pixelada { image-rendering:pixelated; }
.barra { height:10px; border-radius:5px; background:var(--fondo-barra); overflow:hidden; margin-top:20px; }
.barra i { display:block; height:100%; background:var(--acento-texto); transition:width .4s ease; }

/* La tarjeta de arriba: UNA cosa, grande y en el color de la marca. Nada más pesa lo mismo. */
.toca { margin-top:clamp(24px,3vw,40px); padding:clamp(24px,3.2vw,52px); border-radius:16px; color:var(--sobre-acento);
        background:var(--acento) linear-gradient(135deg, transparent 35%, color-mix(in srgb, var(--sobre-acento) 12%, transparent)); }
.toca h2, .toca strong, .toca h3 { color:inherit; }
.toca a:not(.boton) { color:inherit; text-decoration-thickness:2px; text-underline-offset:3px; }
.toca .eti { margin:0 0 12px; font-weight:700; font-size:1.125rem; }
.toca .eti .urge { font-weight:800; }
.toca .que { font-size:clamp(1.75rem,2.7vw,3.25rem); line-height:1.08; font-weight:800; letter-spacing:-.01em; margin:0; max-width:28ch; text-wrap:balance; }
.toca .porque { font-size:clamp(1.125rem,1.3vw,1.375rem); line-height:1.45; margin:16px 0 0; max-width:62ch; }
.toca .nota { margin:12px 0 0; max-width:62ch; }
.toca-cuerpo { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:24px clamp(32px,4vw,80px); align-items:start; }
.toca-cuerpo.solo { grid-template-columns:minmax(0,1fr); }
.toca-cuerpo.solo .toca-como { margin-top:6px; }
.pasos { list-style:none; margin:0; padding:0; counter-reset:paso; display:grid; gap:14px; max-width:68ch; }
.pasos li { display:grid; grid-template-columns:2.1rem minmax(0,1fr); gap:10px; font-size:1.125rem; line-height:1.45; counter-increment:paso; }
.pasos li::before { content:counter(paso); font-family:var(--letra-titulos); font-weight:800; font-size:1.375rem; line-height:1.2; }
.toca .acciones { margin-top:24px; }
.pasos:empty + .acciones, .toca-como > .acciones:first-child { margin-top:0; }
.dime { margin:18px 0 0; max-width:62ch; }
.dime b { font-weight:800; }
.puntos { display:flex; gap:7px; margin-top:28px; max-width:640px; }
.puntos i { flex:0 1 34px; min-width:5px; height:8px; border-radius:4px; background:color-mix(in srgb, var(--sobre-acento) 30%, transparent); }
.puntos i.si { background:var(--sobre-acento); }
.entra { animation:entra .42s cubic-bezier(.2,.7,.2,1) both; }
@keyframes entra { from { opacity:0; transform:translateY(calc(14px * var(--mueve))); } }

/* Botones. Dentro de la tarjeta, el principal en el color de la letra y el resto en un fondo suave. */
.acciones { display:flex; flex-wrap:wrap; gap:12px; margin:14px 0 0; }
.boton { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:8px 18px; border-radius:8px; border:0; font:700 1rem/1.2 var(--letra-titulos); cursor:pointer; white-space:nowrap; text-decoration:none; background:var(--boton-suave); color:var(--boton-suave-texto); transition:filter .18s ease, transform .18s ease; }
.boton.fuerte { background:var(--acento); color:var(--sobre-acento); }
.boton:hover { filter:brightness(1.1); }
.toca .boton { min-height:56px; padding:12px 26px; border-radius:10px; font-size:1.125rem; background:color-mix(in srgb, var(--sobre-acento) 17%, transparent); color:var(--sobre-acento); }
.toca .boton.fuerte { background:var(--sobre-acento); color:var(--acento); }
.toca .boton:hover { filter:none; transform:translateY(calc(-1px * var(--mueve))); }
.boton:focus-visible, .opcion:focus-visible, .luego:focus-visible, .ir-a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid var(--acento-texto); outline-offset:2px; }
.toca .boton:focus-visible, .toca .opcion:focus-visible, .toca textarea:focus-visible { outline-color:var(--sobre-acento); }

/* Una decisión dentro de la tarjeta: las opciones como botones grandes, la recomendada dicha con palabras. */
.opciones { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:12px; margin:24px 0 0; }
.opcion { position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:4px; width:100%; min-height:64px; text-align:left; font:inherit; color:inherit; cursor:pointer;
          background:color-mix(in srgb, var(--sobre-acento) 12%, transparent); border:2px solid color-mix(in srgb, var(--sobre-acento) 38%, transparent); border-radius:10px; padding:16px 52px 16px 18px; transition:background .18s ease, border-color .18s ease; }
@media (hover:hover) { .opcion:hover { border-color:var(--sobre-acento); } }
.opcion svg { width:24px; height:24px; display:block; margin-bottom:4px; }
.opcion .palabra { font-family:var(--letra-titulos); font-weight:800; font-size:1.25rem; line-height:1.25; }
.opcion .frase { font-size:1rem; line-height:1.45; }
.opcion .rec { font-weight:800; font-size:1rem; margin-top:6px; }
.opcion::after { content:""; position:absolute; right:16px; top:18px; width:22px; height:22px; border-radius:50%; border:2px solid currentColor; opacity:.8; }
.opciones.varias .opcion::after { border-radius:5px; }
.opcion[aria-pressed="true"] { background:var(--sobre-acento); border-color:var(--sobre-acento); color:var(--acento); }
.opcion[aria-pressed="true"]::after { opacity:1; background:radial-gradient(circle, currentColor 0 5px, transparent 6px); }
.opciones.varias .opcion[aria-pressed="true"]::after { background:linear-gradient(currentColor, currentColor) center / 10px 10px no-repeat; }
.recomiendo { margin:16px 0 0; max-width:70ch; }
.ficha { display:grid; gap:6px; margin:16px 0 0; max-width:80ch; }
.ficha div { display:grid; grid-template-columns:7rem minmax(0,1fr); gap:10px; }
.ficha dt { font-weight:800; }
.ficha dd { margin:0; }
.elegida-nombre { font-weight:800; margin:18px 0 0; }
textarea { display:block; width:100%; min-height:52px; margin-top:18px; padding:12px 14px; border:2px solid var(--linea); border-radius:8px; background:transparent; color:var(--tinta); font:inherit; resize:none; overflow:hidden; }
.toca textarea { color:inherit; border-color:color-mix(in srgb, var(--sobre-acento) 45%, transparent); background:color-mix(in srgb, var(--sobre-acento) 7%, transparent); }
textarea::placeholder { color:var(--suave); opacity:1; }
.toca textarea::placeholder { color:color-mix(in srgb, var(--sobre-acento) 82%, transparent); }
.defecto { margin:10px 0 0; }
.resumen { list-style:none; margin:20px 0 0; padding:0; display:grid; gap:14px; max-width:90ch; }
.resumen li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; }
.resumen b { display:block; }

/* Después: lo que viene, solo en títulos. Pulsar uno lo sube a la tarjeta. */
.despues { margin-top:28px; }
.despues h2 { font-size:1.25rem; margin-bottom:12px; }
.fichas-luego { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap:14px; }
.luego { display:block; width:100%; min-height:64px; text-align:left; cursor:pointer; background:var(--card); color:var(--tinta); border:2px solid var(--linea); border-radius:10px; padding:16px 20px;
         font:700 1.125rem/1.3 var(--letra-titulos); transition:border-color .18s ease, transform .18s ease; }
@media (hover:hover) { .luego:hover { border-color:var(--acento-texto); transform:translateY(calc(-2px * var(--mueve))); } }

/* Lo de debajo, más pequeño y plegado: no es lo que hay que mirar. */
details.plegable { margin-top:22px; }
details.plegable summary { cursor:pointer; font-family:var(--letra-titulos); font-weight:800; font-size:1.25rem; color:var(--tinta); list-style:none; display:flex; align-items:center; gap:12px; min-height:44px; }
details.plegable summary::-webkit-details-marker { display:none; }
details.plegable summary::before { content:""; width:10px; height:10px; border:solid var(--tinta); border-width:0 3px 3px 0; transform:rotate(-45deg); transition:transform .18s ease; flex:none; }
details.plegable[open] summary::before { transform:translateY(-3px) rotate(45deg); }
details.plegable .dentro { margin-top:14px; }
.hago { margin-top:52px; }
.ahora-yo { color:var(--tinta); margin:0; max-width:90ch; }
.ahora-yo b { font-weight:800; }
.parte { margin:8px 0 0; max-width:90ch; }
.flujo { column-gap:clamp(32px,4vw,72px); }
.flujo > * { break-inside:avoid; }
.flujo.dos { columns:2 420px; }
.fase { margin:18px 0 0; }
.flujo > .fase:first-child { margin-top:0; }
.fase-cab { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin:0 0 6px; }
.fase-cab span { color:var(--suave); white-space:nowrap; }
.parado-cab { color:var(--rojo); }
.tareas { list-style:none; margin:0; padding:0; }
.tarea { display:grid; grid-template-columns:24px minmax(0,1fr); gap:0 12px; padding:7px 0; }
.casilla { width:24px; height:24px; margin-top:2px; border:2px solid var(--caja); border-radius:5px; display:grid; place-items:center; }
.tarea.hecho .casilla { background:var(--verde); border-color:var(--verde); }
.tarea.hecho .casilla::after { content:""; width:6px; height:12px; border:solid #fff; border-width:0 3px 3px 0; transform:translateY(-2px) rotate(45deg); }
.tarea.haciendo .casilla { border-color:var(--acento-texto); }
.tarea.bloqueado .casilla { border-color:var(--rojo); }
.tarea .texto { color:var(--tinta); }
.tarea.descartado .texto { text-decoration:line-through; color:var(--suave); }
.nota-fila { display:block; color:var(--suave); }
.estado-palabra { font-weight:700; color:var(--acento-texto); }
.estado-palabra.parado { color:var(--rojo); }
input[type=checkbox] { appearance:none; -webkit-appearance:none; width:24px; height:24px; margin:2px 0 0; border:2px solid var(--caja); border-radius:5px; background:transparent; cursor:pointer; flex:none; display:grid; place-items:center; }
input[type=checkbox]:checked { background:var(--verde); border-color:var(--verde); }
input[type=checkbox]:checked::after { content:""; width:6px; height:12px; border:solid #fff; border-width:0 3px 3px 0; transform:translateY(-2px) rotate(45deg); }
.ir-a { font:inherit; color:var(--tinta); background:none; border:0; padding:0; text-align:left; cursor:pointer; }
@media (hover:hover) { .ir-a:hover { color:var(--acento-texto); } }
.tarea.marcada .ir-a { text-decoration:line-through; color:var(--suave); cursor:default; }

@media (max-width:1000px) {
  .toca-cuerpo { grid-template-columns:minmax(0,1fr); }
  .mascota { width:68px; height:68px; }
  .logo { height:40px; }
}
@media (max-width:640px) {
  .cab-lado { width:100%; justify-content:space-between; align-items:center; }
  .cifra, .cifra-texto { text-align:left; }
  .toca { border-radius:12px; }
  .toca .acciones { flex-direction:column; }
  .toca .boton { width:100%; white-space:normal; text-align:center; }
  .resumen li { grid-template-columns:minmax(0,1fr); }
}
</style>
</head>
<body>
<div class="hoja">
  <header class="cab">
    <div class="cab-texto">
      <img class="logo" id="logo" alt="" hidden>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo" hidden></p>
      <p class="sello" id="sello"></p>
    </div>
    <div class="cab-lado">
      <div>
        <div class="cifra" id="cifra"></div>
        <p class="cifra-texto" id="cifra-texto"></p>
      </div>
      <img class="mascota" id="mascota" alt="" hidden>
    </div>
  </header>
  <div class="barra" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" id="barra"><i id="barra-i"></i></div>

  <section class="toca" id="ahora" aria-live="polite"></section>
  <section class="despues" id="despues" hidden></section>
  <section id="tuyo"></section>
  <section class="hago" id="hago" hidden></section>
  <section id="listo"></section>
</div>

<script id="gresso-datos" type="application/json">__DATOS_JSON__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById("gresso-datos").textContent);
  var CLAVE = "gresso:" + location.pathname;
  function leer(k, def){
    try {
      var v = localStorage.getItem(CLAVE + ":" + k);
      // Una página pasada de otra plantilla conserva lo marcado: se busca la misma ruta con otro prefijo.
      if (v === null) for (var i = 0; i < localStorage.length; i++) {
        var nombre = localStorage.key(i), fin = ":" + location.pathname + ":" + k;
        if (nombre.slice(-fin.length) === fin) { v = localStorage.getItem(nombre); break; }
      }
      return v === null ? def : JSON.parse(v);
    } catch(_){ return def; }
  }
  function guardar(k, v){ try { localStorage.setItem(CLAVE + ":" + k, JSON.stringify(v)); } catch(_){} }
  // Lo que se mira ahora y lo plegado duran lo que la pestaña: sobreviven a que se ponga al día sola.
  function leerSesion(k, def){ try { var v = sessionStorage.getItem(CLAVE + ":" + k); return v === null ? def : JSON.parse(v); } catch(_){ return def; } }
  function guardarSesion(k, v){ try { sessionStorage.setItem(CLAVE + ":" + k, JSON.stringify(v)); } catch(_){} }
  var marcas = leer("marcas", {}), respuestas = leer("respuestas", {}), fijada = leerSesion("ahora", null);
  function el(tag, clase, txt){ var e = document.createElement(tag); if (clase) e.className = clase; if (txt !== undefined) e.textContent = txt; return e; }
  function $(id){ return document.getElementById(id); }

  // Los textos largos admiten negrita, cursiva, código, saltos y enlaces. Nada más se interpreta.
  var PERMITIDAS = {STRONG:1, B:1, EM:1, I:1, CODE:1, BR:1, A:1};
  function limpia(origen, destino){
    Array.prototype.forEach.call(origen.childNodes, function(n){
      if (n.nodeType === 3) { destino.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      if (!PERMITIDAS[n.tagName]) { limpia(n, destino); return; }
      var e = document.createElement(n.tagName);
      if (n.tagName === "A") { var h = n.getAttribute("href") || ""; if (/^(https?:|mailto:|file:)/i.test(h)) { e.href = h; e.target = "_blank"; e.rel = "noopener"; } }
      limpia(n, e); destino.appendChild(e);
    });
  }
  function rico(tag, clase, html){ var e = el(tag, clase); limpia(new DOMParser().parseFromString(String(html), "text/html").body, e); return e; }

  // La marca del proyecto llega como datos: logo, mascota, colores y letra. Sin ella, la paleta neutra.
  var M = D.marca || {};
  var NOMBRES = {fondo:"--bg", tarjeta:"--card", tinta:"--tinta", texto:"--texto", suave:"--suave", acento:"--acento", acentoTexto:"--acento-texto", sobreAcento:"--sobre-acento", botonSuave:"--boton-suave", botonSuaveTexto:"--boton-suave-texto", linea:"--linea", caja:"--caja", exito:"--verde", alerta:"--rojo", fondoBarra:"--fondo-barra"};
  function reglas(colores){
    var r = "";
    // Sin marca, el acento llega vacío: dejarlo pasar escribiría "--acento:undefined" y la tarjeta se quedaría sin fondo.
    for (var k in colores) if (NOMBRES[k] && colores[k] != null && /^[#\w(),.%\s-]+$/.test(String(colores[k]))) r += NOMBRES[k] + ":" + colores[k] + ";";
    return r;
  }
  function sobre(hex){
    var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
    if (!m) return null;
    var n = parseInt(m[1], 16), lum = [n >> 16, n >> 8 & 255, n & 255].map(function(c){ c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); });
    return .2126 * lum[0] + .7152 * lum[1] + .0722 * lum[2] > .4 ? "#15181E" : "#FFFFFF";
  }
  (function(){
    var c = M.colores || {}, o = M.oscuro || {};
    // El acento y la letra valen en los dos temas; el resto de colores claros, solo en el claro.
    var comun = reglas({acento:c.acento}), claro = reglas(c), osc = reglas(o);
    if (c.acento && !c.acentoTexto) claro += "--acento-texto:" + c.acento + ";";
    if (c.acento && sobre(c.acento) && !c.sobreAcento) comun += "--sobre-acento:" + sobre(c.acento) + ";";
    if (M.letra) comun += "--letra:" + String(M.letra).replace(/[;{}]/g, "") + ",system-ui,sans-serif;";
    if (M.letraTitulos) comun += "--letra-titulos:" + String(M.letraTitulos).replace(/[;{}]/g, "") + ",system-ui,sans-serif;";
    if (c.acento && !o.acentoTexto) osc += "--acento-texto:" + (o.acento || "color-mix(in srgb, " + c.acento + " 58%, white)") + ";";
    if (o.acento && sobre(o.acento) && !o.sobreAcento) osc += "--sobre-acento:" + sobre(o.acento) + ";";
    var st = document.createElement("style");
    st.textContent = ":root{" + comun + "}@media (prefers-color-scheme: light){:root{" + claro + "}}@media (prefers-color-scheme: dark){:root{" + osc + "}}";
    document.head.appendChild(st);
    function imagen(id, claro, oscuro, alt){
      var img = $(id);
      if (!/^data:image\//.test(claro || "")) return;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      function poner(){ img.src = mq.matches && oscuro ? oscuro : claro; }
      poner(); img.hidden = false; img.alt = alt || "";
      if (oscuro && mq.addEventListener) mq.addEventListener("change", poner);
    }
    imagen("logo", M.logo, M.logoOscuro, M.nombre);
    imagen("mascota", M.mascota, M.mascotaOscura, "");
    if (M.pixelada) $("mascota").classList.add("pixelada");
  })();

  var fases = D.fases || [], todas = [];
  fases.forEach(function(f){ (f.tareas || []).forEach(function(t){ todas.push(t); }); });
  function deLaPersona(t){ return t.quien === "tu" || !!t.decision; }
  function marcada(t){ return t.quien === "tu" && !t.decision && !!marcas[t.id]; }
  function hecha(t){ return t.estado === "hecho" || marcada(t); }
  function queda(t){ return !hecha(t) && t.estado !== "descartado"; }
  function peso(t){ return typeof t.peso === "number" && t.peso > 0 ? t.peso : 1; }
  function plural(n, uno, varios){ return n === 1 ? uno : varios; }
  function porId(id){ return todas.filter(function(t){ return t.id === id; })[0]; }

  var pct = 0;
  function pintarCifra(){

      else {
        var c = el("input"); c.type = "checkbox"; c.checked = marcada(t); c.setAttribute("aria-label", "Hecho: " + t.texto);
        c.onchange = function(){ if (c.checked) marcas[t.id] = 1; else delete marcas[t.id]; guardar("marcas", marcas); refrescar(); };
        li.appendChild(c);
      }
      var ir = el("button", "ir-a", t.texto); ir.type = "button";
      if (marcada(t) || t.estado === "bloqueado") ir.disabled = true; else ir.onclick = function(){ irA(t.id); };
      cuerpo.appendChild(ir);
      if (t.estado === "bloqueado") { var n = el("span", "nota-fila"); n.appendChild(el("span", "estado-palabra parado", "Parado")); if (t.nota) { n.appendChild(document.createTextNode(": ")); n.appendChild(rico("span", "", t.nota)); } cuerpo.appendChild(n); }
      else if (t.decision && respondida(t)) cuerpo.appendChild(el("span", "nota-fila", "Decidida: " + (elegidas(t) || "con tus palabras")));
      li.appendChild(cuerpo); ul.appendChild(li);
    });
    var quedan = suyas.filter(function(t){ return !resuelta(t); }).length;
    caja.appendChild(plegable("tuyo", "Ver todo lo tuyo (" + (quedan ? plural(quedan, "queda 1", "quedan " + quedan) : "hecho") + ")", ul));
  }

  function filaTarea(t, sinPalabra){
    var clase = hecha(t) ? "hecho" : t.estado === "haciendo" || t.estado === "bloqueado" || t.estado === "descartado" ? t.estado : "";
    var li = el("li", "tarea " + clase);
    li.appendChild(el("span", "casilla"));
    var c = el("div");
    c.appendChild(el("span", "texto", t.texto));
    if (t.estado === "haciendo") { c.appendChild(document.createTextNode(" ")); c.appendChild(el("span", "estado-palabra", "Ahora")); }
    if (t.estado === "bloqueado" && !sinPalabra) { c.appendChild(document.createTextNode(" ")); c.appendChild(el("span", "estado-palabra parado", "Parado")); }
    if (t.nota) c.appendChild(rico("span", "nota-fila", t.nota));
    li.appendChild(c);
    return li;
  }
  function listaFase(nombre, tareas, cuenta, claseCab, sinPalabra){
    var sec = el("div", "fase"), cab = el("div", "fase-cab");
    if (nombre) cab.appendChild(el("h3", claseCab || "", nombre));
    if (cuenta) cab.appendChild(el("span", "", cuenta));
    if (cab.children.length) sec.appendChild(cab);
    var ul = el("ul", "tareas");
    tareas.forEach(function(t){ ul.appendChild(filaTarea(t, sinPalabra)); });
    sec.appendChild(ul);
    return sec;
  }

  // Lo que hago yo: qué tengo entre manos, el parte, lo parado a la vista y lo demás plegado.
  function pintarHago(){
    var caja = $("hago"), mias = todas.filter(function(t){ return !deLaPersona(t); });
    caja.textContent = "";
    var paradas = mias.filter(function(t){ return t.estado === "bloqueado"; });
    var siguen = mias.filter(function(t){ return queda(t) && t.estado !== "bloqueado"; });
    var yo = lineaYo();
    // Si la tarjeta de arriba ya dice lo que hago, aquí no se repite. Lo parado ya sale en su lista.
    var conAhora = !modoNada && yo && yo.que !== "Parado", conParte = !modoNada && D.parte;
    if (!conAhora && !conParte && !paradas.length && !siguen.length) { caja.hidden = true; return; }
    caja.hidden = false;
    caja.appendChild(el("h2", "", "Lo que hago yo"));
    if (conAhora) { var p = el("p", "ahora-yo"); p.appendChild(el("b", "", yo.que + ": ")); p.appendChild(document.createTextNode(yo.texto)); caja.appendChild(p); }
    if (conParte) caja.appendChild(rico("p", "parte", D.parte));
    if (paradas.length) caja.appendChild(listaFase("Parado", paradas, "", "parado-cab", true));
    if (siguen.length) {
      var flujo = el("div", "flujo");
      fases.forEach(function(f){
        var aqui = (f.tareas || []).filter(function(t){ return siguen.indexOf(t) >= 0; });
        if (!aqui.length) return;
        var propias = (f.tareas || []).filter(function(t){ return !deLaPersona(t) && t.estado !== "descartado"; });
        var hechas = propias.filter(hecha).length;
        flujo.appendChild(listaFase(fases.length > 1 || f.nombre ? f.nombre || "Tareas" : "", aqui, hechas ? hechas + " de " + propias.length : ""));
      });
      if (flujo.children.length > 1) flujo.classList.add("dos");
      caja.appendChild(plegable("mias", "Lo que me queda (" + siguen.length + ")", flujo));
    }
  }

  // Lo que ya está listo, plegado y al final: no es lo que hay que mirar.
  function pintarListo(){
    var caja = $("listo");
    caja.textContent = "";
    var listas = todas.filter(hecha), fuera = todas.filter(function(t){ return t.estado === "descartado"; });
    if (!listas.length && !fuera.length) return;
    var flujo = el("div", "flujo dos");
    fases.forEach(function(f){
      var aqui = (f.tareas || []).filter(hecha);
      if (aqui.length) flujo.appendChild(listaFase(f.nombre || "Tareas", aqui, ""));
    });
    if (fuera.length) flujo.appendChild(listaFase(listas.length ? "Descartado" : "", fuera, ""));
    caja.appendChild(plegable("listo", listas.length ? "Lo que ya está listo (" + listas.length + ")" : "Descartado (" + fuera.length + ")", flujo));
  }

  function refrescar(){
    pintarCifra();
    pintarAhora();
    pintarTuyo();
    pintarHago();
    pintarListo();
    pintarSello();
  }
  refrescar();
  setInterval(pintarSello, 30000);

  // Recargar no te mueve de sitio ni te saca de lo que escribes.
  var ultimaTecla = 0;
  document.addEventListener("input", function(){ ultimaTecla = Date.now(); });
  try {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    var cs = CLAVE + ":sitio", guardado = JSON.parse(sessionStorage.getItem(cs) || "null");
    if (guardado) {
      window.scrollTo(0, guardado.y || 0);
      var foco = guardado.foco && $(guardado.foco);
      if (foco) { foco.focus({preventScroll:true}); try { foco.setSelectionRange(guardado.ini, guardado.fin); } catch(_){} }
    }
    window.addEventListener("beforeunload", function(){
      var a = document.activeElement, sitio = {y:window.scrollY};
      if (a && a.tagName === "TEXTAREA") { sitio.foco = a.id; sitio.ini = a.selectionStart; sitio.fin = a.selectionEnd; }
      try { sessionStorage.setItem(cs, JSON.stringify(sitio)); } catch(_){}
    });
  } catch(_){}

  // Se pone al día sola. Una página abierta como archivo no puede leerse a sí misma con fetch, pero sí
  // cargar un script de al lado: ese script dice si el archivo ha cambiado, y solo entonces recarga.
  var base = location.pathname.split("/").pop(), inicial = null;
  function ocupado(){
    var s = window.getSelection && window.getSelection(), a = document.activeElement;
    if (s && !s.isCollapsed) return true;
    if (!a || a.tagName !== "TEXTAREA") return false;
    return a.selectionStart !== a.selectionEnd || Date.now() - ultimaTecla < 15000;
  }
  function mirar(){
    var s = document.createElement("script");
    s.src = base + ".version.js?x=" + Date.now();
    s.onload = function(){
      s.remove();
      if (!alDia) { alDia = true; pintarSello(); }
      var v = window.__gressoVersion;
      if (inicial === null) inicial = v;
      else if (v !== inicial && !ocupado()) { location.reload(); return; }
      setTimeout(mirar, 5000);
    };
    s.onerror = function(){ s.remove(); setTimeout(mirar, 30000); };
    document.head.appendChild(s);
  }
  mirar();
})();
</script>
</body>
</html>
