<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
:root { color-scheme:light dark; --bg:#F7F7F5; --card:#FFFFFF; --tinta:#15181E; --texto:#333843; --suave:#565B66; --acento:#2F5FB8; --acento-texto:#2F5FB8; --sobre-acento:#FFFFFF; --boton-suave:#E6E9F0; --boton-suave-texto:#15181E; --linea:#DEDDD8; --caja:#A3A39D; --verde:#2B8A57; --rojo:#C8372D; --fondo-barra:#E6E5E0; --letra:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --letra-titulos:var(--letra); }
@media (prefers-color-scheme: dark) { :root { --bg:#111318; --card:#181B22; --tinta:#F2F3F5; --texto:#D2D5DB; --suave:#A9AEB8; --acento-texto:#9DB8F0; --boton-suave:#252A35; --boton-suave-texto:#F2F3F5; --linea:#2C313C; --caja:#666C79; --verde:#4FB37C; --rojo:#F0837A; --fondo-barra:#252A35; } }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; font-size:clamp(16px, calc(8px + .55vw), 20px); }
body { margin:0; background:var(--bg); color:var(--texto); font:400 1.0625rem/1.55 var(--letra); }
.hoja { width:min(1760px,100%); margin:0 auto; padding:28px clamp(16px,4vw,64px) 72px; }
h1,h2,h3 { font-family:var(--letra-titulos); color:var(--tinta); line-height:1.2; margin:0; }
h1 { font-size:clamp(2rem,3.4vw,3rem); font-weight:800; }
h2 { font-size:1.625rem; font-weight:800; margin:0 0 16px; }
h3 { font-size:1.1875rem; font-weight:700; }
strong { color:var(--tinta); font-weight:700; }
code { font-size:.94em; }
a { color:var(--acento-texto); }
.cab { display:flex; align-items:center; justify-content:space-between; gap:24px; }
.logo { display:block; height:52px; width:auto; max-width:100%; margin-bottom:14px; }
.mascota { display:block; width:92px; height:92px; object-fit:contain; flex:none; }
.mascota.pixelada { image-rendering:pixelated; }
.sub { margin:8px 0 0; }
.sello { color:var(--suave); margin:8px 0 0; }
.sello.parada { color:var(--rojo); font-weight:600; }
.arriba { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:clamp(24px,4vw,72px); margin-top:28px; align-items:start; }
.fila-sig { display:grid; grid-template-columns:3.2rem minmax(0,1fr); gap:4px 12px; margin:0 0 16px; }
.fila-sig b { font-family:var(--letra-titulos); font-weight:800; color:var(--tinta); font-size:1.1875rem; line-height:1.4; }
.fila-sig .que { color:var(--tinta); font-size:1.1875rem; line-height:1.4; font-weight:600; }
.fila-sig .como { grid-column:2; }
.fila-sig .boton { grid-column:2; justify-self:start; margin-top:6px; }
.cifra { font-family:var(--letra-titulos); font-weight:800; font-size:clamp(3.25rem,5vw,4.5rem); line-height:1; color:var(--tinta); }
.cifra-texto { color:var(--tinta); font-weight:600; margin:6px 0 12px; }
.barra { height:12px; border-radius:6px; background:var(--fondo-barra); overflow:hidden; }
.barra i { display:block; height:100%; background:var(--acento-texto); transition:width .4s ease; }
.columnas { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:clamp(32px,4vw,72px); margin-top:44px; align-items:start; }
.columnas.sola { grid-template-columns:minmax(0,1fr); }
.columnas > div:empty { display:none; }
.seccion:empty { display:none; }
.seccion + .seccion:not(:empty) { margin-top:44px; }
.flujo { column-gap:clamp(32px,4vw,72px); }
.flujo > * { break-inside:avoid; }
.sola .flujo, .flujo.siempre { columns:2 420px; }
.sola .flujo.una { columns:auto; }
.sola .flujo.una .tareas { columns:2 420px; column-gap:clamp(32px,4vw,72px); }
.sola .flujo.una .tarea { break-inside:avoid; }
.fase { margin:0 0 26px; }
.fase-cab { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin:0 0 8px; }
.fase-cab span { color:var(--suave); white-space:nowrap; }
.parado-cab { color:var(--rojo); }
.tareas { list-style:none; margin:0; padding:0; }
.tarea { display:grid; grid-template-columns:26px minmax(0,1fr); gap:0 12px; padding:9px 0; }
.casilla { width:26px; height:26px; border:2px solid var(--caja); border-radius:5px; display:grid; place-items:center; }
.tarea.hecho .casilla { background:var(--verde); border-color:var(--verde); }
.tarea.hecho .casilla::after { content:""; width:7px; height:13px; border:solid #fff; border-width:0 3px 3px 0; transform:translateY(-2px) rotate(45deg); }
.tarea.haciendo .casilla { border-color:var(--acento-texto); }
.tarea.bloqueado .casilla { border-color:var(--rojo); }
.tarea .texto { color:var(--tinta); }
.tarea.descartado .texto { text-decoration:line-through; color:var(--suave); }
.nota { display:block; font-size:1rem; color:var(--suave); }
.estado-palabra { font-weight:700; color:var(--acento-texto); }
.estado-palabra.parado { color:var(--rojo); }
.tarjeta { background:var(--card); border:2px solid var(--linea); border-radius:8px; padding:20px; margin-bottom:16px; }
.tarjeta h3 { margin-bottom:8px; }
.tarjeta p { margin:0 0 10px; }
.tarjeta .quien { display:grid; grid-template-columns:32px minmax(0,1fr); gap:0 14px; }
.tarjeta ol { margin:0 0 12px; padding-left:1.4rem; }
.tarjeta li { margin:0 0 6px; }
.dime { color:var(--tinta); font-weight:600; margin:10px 0 0 !important; }
.acciones { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 0; }
.boton { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:8px 18px; border-radius:8px; border:0; font:700 1rem/1.2 var(--letra-titulos); cursor:pointer; text-decoration:none; background:var(--boton-suave); color:var(--boton-suave-texto); transition:filter .18s ease; }
.boton.fuerte { background:var(--acento); color:var(--sobre-acento); }
.boton:hover { filter:brightness(1.12); }
.boton:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid var(--acento-texto); outline-offset:2px; }
input[type=checkbox] { appearance:none; -webkit-appearance:none; width:26px; height:26px; margin:0; border:2px solid var(--caja); border-radius:5px; background:transparent; cursor:pointer; flex:none; display:grid; place-items:center; }
input[type=checkbox]:checked { background:var(--verde); border-color:var(--verde); }
input[type=checkbox]:checked::after { content:""; width:7px; height:13px; border:solid #fff; border-width:0 3px 3px 0; transform:translateY(-2px) rotate(45deg); }
.recogida h3 { text-decoration:line-through; color:var(--suave); }
.recogida .cuerpo-tarjeta { display:none; }
.opcion { display:grid; grid-template-columns:26px minmax(0,1fr); gap:0 12px; padding:9px 0; cursor:pointer; align-items:start; }
.opcion .nom { color:var(--tinta); font-weight:600; }
.opcion .det { display:block; font-size:1rem; }
.opcion .rec { color:var(--acento-texto); font-weight:700; }
textarea { display:block; width:100%; min-height:48px; margin-top:8px; padding:10px 12px; border:2px solid var(--linea); border-radius:8px; background:transparent; color:var(--tinta); font:inherit; resize:none; overflow:hidden; }
textarea::placeholder { color:var(--suave); opacity:1; }
.defecto { font-size:1rem; margin:8px 0 0 !important; }
@media (max-width:1000px) {
  .arriba, .columnas { grid-template-columns:minmax(0,1fr); }
  .mascota { width:72px; height:72px; }
  .logo { height:44px; }
}
</style>
</head>
<body>
<div class="hoja">
  <header class="cab">
    <div>
      <img class="logo" id="logo" alt="" hidden>
      <h1 id="titulo"></h1>
      <p class="sub" id="subtitulo" hidden></p>
      <p class="sello" id="sello"></p>
    </div>
    <img class="mascota" id="mascota" alt="" hidden>
  </header>

  <div class="arriba">
    <section id="siguiente"></section>
    <section aria-label="Progreso">
      <div class="cifra" id="cifra"></div>
      <p class="cifra-texto" id="cifra-texto"></p>
      <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barra"><i id="barra-i"></i></div>
    </section>
  </div>

  <div class="columnas sola" id="columnas">
    <div id="col-tu"><section class="seccion" id="decidir"></section><section class="seccion" id="toca"></section></div>
    <div id="col-yo"><section class="seccion" id="hago"></section></div>
  </div>
  <section id="listo"></section>
</div>

<script id="gresso-datos" type="application/json">__DATOS_JSON__</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById("gresso-datos").textContent);
  var CLAVE = "gresso:" + location.pathname;
  function leer(k, def){
    try {
      var v = localStorage.getItem(CLAVE + ":" + k);
      // Una página pasada de otra plantilla conserva lo marcado: se busca la misma ruta con otro prefijo.
      if (v === null) for (var i = 0; i < localStorage.length; i++) {
        var nombre = localStorage.key(i), fin = ":" + location.pathname + ":" + k;
        if (nombre.slice(-fin.length) === fin) { v = localStorage.getItem(nombre); break; }
      }
      return v === null ? def : JSON.parse(v);
    } catch(_){ return def; }
  }
  function guardar(k, v){ try { localStorage.setItem(CLAVE + ":" + k, JSON.stringify(v)); } catch(_){} }
  var marcas = leer("marcas", {}), respuestas = leer("respuestas", {});
  function el(tag, clase, txt){ var e = document.createElement(tag); if (clase) e.className = clase; if (txt !== undefined) e.textContent = txt; return e; }
  function $(id){ return document.getElementById(id); }

  // Los textos largos admiten negrita, cursiva, código, saltos y enlaces. Nada más se interpreta.
  var PERMITIDAS = {STRONG:1, B:1, EM:1, I:1, CODE:1, BR:1, A:1};
  function limpia(origen, destino){
    Array.prototype.forEach.call(origen.childNodes, function(n){
      if (n.nodeType === 3) { destino.appendChild(document.createTextNode(n.nodeValue)); return; }
      if (n.nodeType !== 1) return;
      if (!PERMITIDAS[n.tagName]) { limpia(n, destino); return; }
      var e = document.createElement(n.tagName);
      if (n.tagName === "A") { var h = n.getAttribute("href") || ""; if (/^(https?:|mailto:|file:)/i.test(h)) { e.href = h; e.target = "_blank"; e.rel = "noopener"; } }
      limpia(n, e); destino.appendChild(e);
    });
  }
  function rico(tag, clase, html){ var e = el(tag, clase); limpia(new DOMParser().parseFromString(String(html), "text/html").body, e); return e; }


  var fases = D.fases || [], todas = [];
  fases.forEach(function(f){ (f.tareas || []).forEach(function(t){ todas.push(t); }); });
  function deLaPersona(t){ return t.quien === "tu" || !!t.decision; }
  function marcada(t){ return t.quien === "tu" && !t.decision && !!marcas[t.id]; }
  function hecha(t){ return t.estado === "hecho" || marcada(t); }
  function queda(t){ return !hecha(t) && t.estado !== "descartado"; }
  function peso(t){ return typeof t.peso === "number" && t.peso > 0 ? t.peso : 1; }
  function plural(n, uno, varios){ return n === 1 ? uno : varios; }

  var pct = 0;
  function pintarCifra(){
    var utiles = todas.filter(function(t){ return t.estado !== "descartado"; });
    var total = utiles.reduce(function(s, t){ return s + peso(t); }, 0);
    var hecho = utiles.filter(hecha).reduce(function(s, t){ return s + peso(t); }, 0);
    var n = utiles.filter(hecha).length, resto = utiles.length - n;
    pct = total ? Math.round(hecho / total * 100) : 0;
    if (resto && pct > 99) pct = 99;
    document.title = pct + " % " + (D.titulo || "Seguimiento");
    $("cifra").textContent = pct + " %";
    $("cifra-texto").textContent = utiles.length
      ? n + " de " + utiles.length + plural(utiles.length, " tarea hecha", " tareas hechas") + (resto ? ". " + plural(resto, "Queda 1", "Quedan " + resto) + "." : ".")
      : "Todavía no hay tareas.";
    $("barra").setAttribute("aria-valuenow", String(pct));
    $("barra-i").style.width = pct + "%";
  }

  $("titulo").textContent = D.titulo || "Seguimiento";
  if (D.subtitulo) { $("subtitulo").textContent = D.subtitulo; $("subtitulo").hidden = false; }

  // La hora es la de la última vez que se escribió el archivo.
  var sello = $("sello"), alDia = false;
  var escrita = new Date(document.lastModified);
  if (isNaN(escrita.getTime())) escrita = new Date(String(D.actualizado || "").replace(" ", "T"));
  function pintarSello(){
    var hoy = escrita.toDateString() === new Date().toDateString();
    var cuando = (hoy ? "a las " : "el " + escrita.toLocaleDateString("es-ES", {day:"numeric", month:"long"}) + " a las ") + escrita.toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"});
    sello.className = "sello";
    sello.textContent = "Última novedad " + cuando + "." + (alDia ? " Se pone al día sola." : "");
  }

  function aPortapapeles(texto, boton, aviso){
    function hecho(){ var antes = boton.textContent; boton.textContent = aviso; setTimeout(function(){ boton.textContent = antes; }, 2500); }
    function reserva(){
      var ta = document.createElement("textarea"); ta.value = texto; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); hecho(); } catch(_){}
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(hecho, reserva);
    else reserva();
  }

  // Lo que hay que decidir: casilla por opción, nada marcado de antemano.
  function eleccion(t){
    var r = respuestas[t.id] || {};
    return r.opciones ? r.opciones.slice() : (typeof r.opcion === "number" ? [r.opcion] : []);
  }
  function respondida(t){ var r = respuestas[t.id] || {}; return eleccion(t).length > 0 || !!(r.texto && r.texto.trim()); }
  var decisiones = todas.filter(function(t){ return t.decision && queda(t); });
  function copiarRespuestas(boton){
    var lineas = decisiones.map(function(t, i){
      var r = respuestas[t.id] || {}, ops = t.decision.opciones || [];
      var partes = eleccion(t).map(function(n){ return ops[n] && ops[n].texto; }).filter(Boolean);
      if (r.texto && r.texto.trim()) partes.push("con mis palabras: " + r.texto.trim());
      return (i + 1) + ". " + t.texto + " " + (partes.length ? partes.join(", ") : "(sin responder)");
    });
    aPortapapeles(lineas.join("\n"), boton, "Copiado, pégamelo en el chat");
  }
  if (decisiones.length) {
    var cajaDec = $("decidir");
    cajaDec.appendChild(el("h2", "", "Lo que tienes que decidir"));
    decisiones.forEach(function(t){
      var tar = el("article", "tarjeta"); tar.id = "t-" + t.id;
      tar.appendChild(el("h3", "", t.texto));
      if (t.porque) tar.appendChild(rico("p", "", t.porque));
      var cajas = [];
      (t.decision.opciones || []).forEach(function(o, i){
        var lab = el("label", "opcion");
        var inp = el("input"); inp.type = "checkbox"; inp.checked = eleccion(t).indexOf(i) >= 0;
        cajas.push(inp);
        inp.onchange = function(){
          var r = respuestas[t.id] = respuestas[t.id] || {};
          if (t.decision.varias) {
            r.opciones = cajas.reduce(function(a, c, n){ if (c.checked) a.push(n); return a; }, []);
          } else {
            cajas.forEach(function(c){ if (c !== inp) c.checked = false; });
            if (inp.checked) r.opcion = i; else delete r.opcion;
          }
          guardar("respuestas", respuestas); refrescar();
        };
        var cuerpo = el("span");
        cuerpo.appendChild(el("span", "nom", o.texto));
        if (o.recomendada) cuerpo.appendChild(el("span", "rec", ". La que te recomiendo"));
        if (o.detalle) cuerpo.appendChild(el("span", "det", o.detalle));
        if (o.noHace) cuerpo.appendChild(el("span", "det", "No hace: " + o.noHace));
        lab.appendChild(inp); lab.appendChild(cuerpo); tar.appendChild(lab);
      });
      var r = respuestas[t.id] || {};
      var ta = el("textarea"); ta.id = "r-" + t.id; ta.rows = 1; ta.placeholder = "Otra cosa, con tus palabras"; ta.setAttribute("aria-label", "Otra cosa, con tus palabras"); ta.value = r.texto || "";
      function crece(){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 4 + "px"; }
      ta.oninput = function(){ var q = respuestas[t.id] = respuestas[t.id] || {}; q.texto = ta.value; guardar("respuestas", respuestas); crece(); refrescar(); };
      tar.appendChild(ta);
      if (t.decision.siNoDices) tar.appendChild(el("p", "defecto", t.decision.siNoDices));
      cajaDec.appendChild(tar);
      setTimeout(crece, 0);
    });
    var copiar = el("button", "boton fuerte", "Copiar respuestas"); copiar.type = "button";
    copiar.onclick = function(){ copiarRespuestas(copiar); };
    cajaDec.appendChild(copiar);
  }

  // Lo que le toca a quien lee: por qué, pasos, botones y una casilla que cuenta en el porcentaje.
  var tocan = todas.filter(function(t){ return t.quien === "tu" && !t.decision && t.estado !== "hecho" && t.estado !== "descartado"; });
  if (tocan.length) {
    var cajaToca = $("toca");
    cajaToca.appendChild(el("h2", "", "Lo que te toca"));
    tocan.forEach(function(t){
      var tar = el("article", "tarjeta"); tar.id = "t-" + t.id;
      var fila = el("div", "quien");
      var c = el("input"); c.type = "checkbox"; c.checked = !!marcas[t.id]; c.setAttribute("aria-label", "Hecho: " + t.texto);
      var cuerpo = el("div");
      cuerpo.appendChild(el("h3", "", t.texto));
      var dentro = el("div", "cuerpo-tarjeta");
      if (t.estado === "bloqueado" && t.nota) { var p = rico("p", "", t.nota); p.insertBefore(el("span", "estado-palabra parado", "Parado: "), p.firstChild); dentro.appendChild(p); }
      else if (t.nota) dentro.appendChild(rico("p", "", t.nota));
      if (t.porque) dentro.appendChild(rico("p", "", t.porque));
      if (t.pasos && t.pasos.length) { var ol = el("ol"); t.pasos.forEach(function(q){ ol.appendChild(rico("li", "", q)); }); dentro.appendChild(ol); }
      if (t.acciones && t.acciones.length) {
        var ac = el("div", "acciones");
        t.acciones.forEach(function(a){
          // Lo que se copia no se enseña: solo el nombre del botón.
          if (a.url && /^(https?:|mailto:|file:)/i.test(a.url)) { var l = el("a", "boton", a.texto); l.href = a.url; l.target = "_blank"; l.rel = "noopener"; ac.appendChild(l); }
          else if (a.copiar !== undefined) { var b = el("button", "boton", a.texto || "Copiar"); b.type = "button"; b.onclick = function(){ aPortapapeles(String(a.copiar), b, "Copiado"); }; ac.appendChild(b); }
        });
        dentro.appendChild(ac);
      }
      if (t.dime) dentro.appendChild(rico("p", "dime", t.dime));
      cuerpo.appendChild(dentro);
      function recoger(){ tar.classList.toggle("recogida", !!marcas[t.id]); }
      c.onchange = function(){ if (c.checked) marcas[t.id] = 1; else delete marcas[t.id]; guardar("marcas", marcas); recoger(); refrescar(); };
      fila.appendChild(c); fila.appendChild(cuerpo); tar.appendChild(fila);
      recoger();
      cajaToca.appendChild(tar);
    });
  }

  function filaTarea(t, sinPalabra){
    var clase = hecha(t) ? "hecho" : t.estado === "haciendo" || t.estado === "bloqueado" || t.estado === "descartado" ? t.estado : "";
    var li = el("li", "tarea " + clase);
    li.appendChild(el("span", "casilla"));
    var c = el("div");
    c.appendChild(el("span", "texto", t.texto));
    if (t.estado === "haciendo") { c.appendChild(document.createTextNode(" ")); c.appendChild(el("span", "estado-palabra", "Ahora")); }
    if (t.estado === "bloqueado" && !sinPalabra) { c.appendChild(document.createTextNode(" ")); c.appendChild(el("span", "estado-palabra parado", "Parado")); }
    if (t.nota) c.appendChild(rico("span", "nota", t.nota));
    li.appendChild(c);
    return li;
  }

  // Lo que hace el agente: primero lo parado, luego por fases.
  var flujo = el("div", "flujo");
  var paradas = todas.filter(function(t){ return !deLaPersona(t) && t.estado === "bloqueado"; });
  function enLista(t){ return !deLaPersona(t) && t.estado !== "bloqueado"; }
  if (paradas.length) {
    var secP = el("div", "fase");
    secP.appendChild(el("h3", "parado-cab", "Parado"));
    var ulP = el("ul", "tareas");
    paradas.forEach(function(t){ ulP.appendChild(filaTarea(t, true)); });
    secP.appendChild(ulP);
    flujo.appendChild(secP);
  }
  fases.forEach(function(f){
    var aqui = (f.tareas || []).filter(enLista);
    if (!aqui.length) return;
    var propias = (f.tareas || []).filter(function(t){ return !deLaPersona(t) && t.estado !== "descartado"; });
    var hechas = propias.filter(hecha).length;
    var sec = el("div", "fase");
    var cab = el("div", "fase-cab");
    if (fases.length > 1 || f.nombre) cab.appendChild(el("h3", "", f.nombre || "Tareas"));
    if (hechas) cab.appendChild(el("span", "", hechas + " de " + propias.length));
    sec.appendChild(cab);
    var ul = el("ul", "tareas");
    aqui.forEach(function(t){ ul.appendChild(filaTarea(t)); });
    sec.appendChild(ul);
    flujo.appendChild(sec);
  });
  if (flujo.children.length) {
    $("hago").appendChild(el("h2", "", "Lo que hago yo"));
    if (flujo.children.length === 1) flujo.classList.add("una");
    $("hago").appendChild(flujo);
  }
  // Dos columnas solo si las dos tienen algo: nunca media página vacía.
  $("columnas").classList.toggle("sola", !$("decidir").children.length && !$("toca").children.length || !flujo.children.length);

  // Lo siguiente sale solo de las tareas.
  function irA(id){ var e = $("t-" + id); if (e) e.scrollIntoView({behavior:"smooth", block:"center"}); }
  function pintarSiguiente(){
    var caja = $("siguiente");
    caja.textContent = "";
    caja.appendChild(el("h2", "", "Lo siguiente"));
    var mirables = todas.filter(function(t){ return deLaPersona(t) && queda(t) && t.estado !== "bloqueado" && !marcada(t); });
    var tuya = mirables.filter(function(t){ return !(t.decision && respondida(t)); })[0];
    var porPasar = mirables.filter(function(t){ return t.decision && respondida(t); });
    var filaTu = el("div", "fila-sig");
    filaTu.appendChild(el("b", "", "Tú"));
    if (tuya) {
      filaTu.appendChild(el("span", "que", (tuya.decision ? "Decidir: " : "") + tuya.texto));
      var ir = el("button", "boton fuerte", tuya.decision ? "Ir a la decisión" : "Ir a ese paso");
      ir.type = "button"; ir.onclick = function(){ irA(tuya.id); };
      filaTu.appendChild(ir);
    } else if (porPasar.length) {
      filaTu.appendChild(el("span", "que", "Pasarme lo que has decidido"));
      var pasar = el("button", "boton fuerte", "Copiar respuestas");
      pasar.type = "button"; pasar.onclick = function(){ copiarRespuestas(pasar); };
      filaTu.appendChild(pasar);
    } else {
      filaTu.appendChild(el("span", "que", "Nada ahora mismo. Te aviso aquí cuando te necesite."));
    }
    caja.appendChild(filaTu);
    var mias = todas.filter(function(t){ return !deLaPersona(t) && t.estado === "haciendo"; });
    var quedanMias = todas.filter(function(t){ return !deLaPersona(t) && queda(t); });
    var filaYo = el("div", "fila-sig");
    filaYo.appendChild(el("b", "", "Yo"));
    var ahora;
    if (mias.length) ahora = mias.map(function(t){ return t.texto; }).join(". ");
    else if (!todas.some(queda) && todas.length) ahora = "Terminado.";
    else if (mirables.length) ahora = "Esperándote: no tengo nada en marcha.";
    else if (quedanMias.filter(function(t){ return t.estado !== "bloqueado"; }).length) ahora = "Nada en marcha ahora mismo. Lo próximo: " + quedanMias.filter(function(t){ return t.estado !== "bloqueado"; })[0].texto;
    else if (quedanMias.length) ahora = "Parado: " + quedanMias[0].texto;
    else ahora = "Nada en marcha ahora mismo.";
    filaYo.appendChild(el("span", "que", ahora));
    if (D.parte) filaYo.appendChild(rico("span", "como", D.parte));
    caja.appendChild(filaYo);
  }


  function refrescar(){
    pintarCifra();
    pintarSiguiente();
    pintarSello();
  }
  refrescar();
  setInterval(pintarSello, 30000);

  // Recargar no te mueve de sitio ni te saca de lo que escribes.
  var ultimaTecla = 0;
  document.addEventListener("input", function(){ ultimaTecla = Date.now(); });
  try {
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    var cs = CLAVE + ":sitio", guardado = JSON.parse(sessionStorage.getItem(cs) || "null");
    if (guardado) {
      window.scrollTo(0, guardado.y || 0);
      var foco = guardado.foco && $(guardado.foco);
      if (foco) { foco.focus({preventScroll:true}); try { foco.setSelectionRange(guardado.ini, guardado.fin); } catch(_){} }
    }
    window.addEventListener("beforeunload", function(){
      var a = document.activeElement, sitio = {y:window.scrollY};
      if (a && a.tagName === "TEXTAREA") { sitio.foco = a.id; sitio.ini = a.selectionStart; sitio.fin = a.selectionEnd; }
      try { sessionStorage.setItem(cs, JSON.stringify(sitio)); } catch(_){}
    });
  } catch(_){}

  // Se pone al día sola. Una página abierta como archivo no puede leerse a sí misma con fetch, pero sí
  // cargar un script de al lado: ese script dice si el archivo ha cambiado, y solo entonces recarga.
  var base = location.pathname.split("/").pop(), inicial = null;
  function ocupado(){
    var s = window.getSelection && window.getSelection(), a = document.activeElement;
    if (s && !s.isCollapsed) return true;
    if (!a || a.tagName !== "TEXTAREA") return false;
    return a.selectionStart !== a.selectionEnd || Date.now() - ultimaTecla < 15000;
  }
  function mirar(){
    var s = document.createElement("script");
    s.src = base + ".version.js?x=" + Date.now();
    s.onload = function(){
      s.remove();
      if (!alDia) { alDia = true; pintarSello(); }
      var v = window.__gressoVersion;
      if (inicial === null) inicial = v;
      else if (v !== inicial && !ocupado()) { location.reload(); return; }
      setTimeout(mirar, 5000);
    };
    s.onerror = function(){ s.remove(); setTimeout(mirar, 30000); };
    document.head.appendChild(s);
  }
  mirar();
})();
</script>
</body>
</html>
